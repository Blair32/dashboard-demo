<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>주요원료 재고 대시보드 (배포용)</title>
<style>
  :root{
    --bg:#F5F6F2;
    --surface:#FFFFFF;
    --surface-alt:#EEF1E9;
    --border:#DEE4D7;
    --text:#20261F;
    --text-muted:#5C6B58;
    --accent:#2F6B45;
    --accent-strong:#204E33;
    --accent-soft:#E3EFE2;
    --good:#2F8F5B;
    --good-soft:#E3F3E9;
    --warn:#B9761F;
    --warn-soft:#FBF0DE;
    --critical:#BC3F2C;
    --critical-soft:#FAE6E1;
    --gray-badge:#8B948A;
    --gray-soft:#EEF0EC;
    --shadow: 0 1px 2px rgba(32,38,31,0.06), 0 6px 20px rgba(32,38,31,0.05);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#151A13;
      --surface:#1D241B;
      --surface-alt:#232B20;
      --border:#343F30;
      --text:#E9ECE4;
      --text-muted:#9DAA97;
      --accent:#79C594;
      --accent-strong:#9AD8AF;
      --accent-soft:#25342A;
      --good:#63CB90;
      --good-soft:#1F3226;
      --warn:#E3AC5C;
      --warn-soft:#3A2F1C;
      --critical:#E68972;
      --critical-soft:#3B241E;
      --gray-badge:#8A9385;
      --gray-soft:#242B21;
      --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 8px 24px rgba(0,0,0,0.35);
    }
  }
  :root[data-theme="dark"]{
    --bg:#151A13;
    --surface:#1D241B;
    --surface-alt:#232B20;
    --border:#343F30;
    --text:#E9ECE4;
    --text-muted:#9DAA97;
    --accent:#79C594;
    --accent-strong:#9AD8AF;
    --accent-soft:#25342A;
    --good:#63CB90;
    --good-soft:#1F3226;
    --warn:#E3AC5C;
    --warn-soft:#3A2F1C;
    --critical:#E68972;
    --critical-soft:#3B241E;
    --gray-badge:#8A9385;
    --gray-soft:#242B21;
    --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 8px 24px rgba(0,0,0,0.35);
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:"Malgun Gothic","맑은 고딕",-apple-system,"Apple SD Gothic Neo","Segoe UI",sans-serif;
    letter-spacing:-0.01em;
    line-height:1.55;
    -webkit-font-smoothing:antialiased;
  }
  .app{
    max-width:1880px;
    margin:0 auto;
    padding:28px 32px 64px;
  }

  /* ---------- Header ---------- */
  .header{
    display:flex;
    justify-content:space-between;
    align-items:flex-end;
    flex-wrap:wrap;
    gap:16px;
    padding-bottom:20px;
    border-bottom:1px solid var(--border);
    margin-bottom:24px;
  }
  .header-left .eyebrow{
    font-size:12px;
    font-weight:700;
    color:var(--accent);
    letter-spacing:0.04em;
    text-transform:uppercase;
    margin-bottom:6px;
  }
  .header-left h1{
    font-size:26px;
    font-weight:800;
    margin:0;
    letter-spacing:-0.01em;
    text-wrap:balance;
  }
  .header-left .sub{
    margin-top:6px;
    font-size:13.5px;
    color:var(--text-muted);
  }
  .header-right{
    display:flex;
    align-items:center;
    gap:10px;
  }
  .badge-share{
    display:inline-flex;
    align-items:center;
    gap:6px;
    font-size:12px;
    font-weight:700;
    color:var(--accent-strong);
    background:var(--accent-soft);
    border:1px solid var(--border);
    padding:7px 12px;
    border-radius:999px;
    letter-spacing:0;
  }
  .badge-share .dot{width:6px;height:6px;border-radius:50%;background:var(--good);}
  .date-chip{
    font-size:12.5px;
    color:var(--text-muted);
    background:var(--surface);
    border:1px solid var(--border);
    padding:7px 12px;
    border-radius:999px;
    font-variant-numeric:tabular-nums;
  }

  /* ---------- KPI row ---------- */
  .kpi-row{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:14px;
    margin-bottom:28px;
  }
  .kpi{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:14px;
    padding:16px 18px;
    box-shadow:var(--shadow);
  }
  .kpi .label{
    font-size:12px;
    color:var(--text-muted);
    font-weight:600;
    margin-bottom:8px;
  }
  .kpi .value{
    font-size:24px;
    font-weight:800;
    font-variant-numeric:tabular-nums;
    letter-spacing:0;
  }
  .kpi .value small{
    font-size:13px;
    font-weight:600;
    color:var(--text-muted);
    margin-left:3px;
  }
  .kpi .foot{
    margin-top:6px;
    font-size:12px;
    color:var(--text-muted);
  }
  .kpi .foot.crit{color:var(--critical);font-weight:700;}

  /* ---------- Tab bar (raw materials) ---------- */
  .section-title{
    font-size:13px;
    font-weight:700;
    color:var(--text-muted);
    letter-spacing:0.02em;
    margin:0 0 12px 2px;
  }
  .tabbar{
    position:sticky;
    top:0;
    z-index:20;
    display:flex;
    gap:6px;
    background:var(--bg);
    padding:10px 0 16px;
    margin-bottom:22px;
    border-bottom:1px solid var(--border);
    overflow-x:auto;
  }
  .tab-btn{
    display:flex;
    align-items:center;
    gap:8px;
    flex:none;
    cursor:pointer;
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:12px;
    padding:11px 18px;
    font-family:inherit;
    font-size:14px;
    font-weight:700;
    color:var(--text-muted);
    letter-spacing:inherit;
    transition:border-color .15s ease, color .15s ease, background .15s ease;
  }
  .tab-btn .icon{font-size:16px;line-height:1;}
  .tab-btn .dot{width:7px;height:7px;border-radius:50%;flex:none;}
  .tab-btn .dot.good{background:var(--good);}
  .tab-btn .dot.warn{background:var(--warn);}
  .tab-btn .dot.crit{background:var(--critical);}
  .tab-btn .dot.gray{background:var(--gray-badge);}
  .tab-btn:hover{border-color:var(--accent);color:var(--text);}
  .tab-btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}
  .tab-btn.active{
    background:var(--accent);
    border-color:var(--accent);
    color:#FFFFFF;
  }
  .tab-btn.active .dot{box-shadow:0 0 0 2px rgba(255,255,255,0.55);}

  /* ---------- Overview ---------- */
  .overview-hint{
    font-size:13px;
    color:var(--text-muted);
    margin:-6px 2px 18px;
  }
  /* table footnotes: own box (not the tight negative-margin overview-hint) so it never
     collides with a heading or table sitting right after it */
  .table-note{
    font-size:12.5px;
    color:var(--text-muted);
    background:var(--surface-alt);
    border:1px solid var(--border);
    border-radius:10px;
    padding:8px 12px;
    margin:10px 0 0;
    line-height:1.5;
  }
  .compare-wrap{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:16px;
    padding:8px;
    box-shadow:var(--shadow);
    overflow-x:auto;
  }
  table.compare{min-width:760px;}
  table.compare tbody tr{cursor:pointer;}
  .mat-cell{display:flex;align-items:center;gap:10px;text-align:left;}
  .mat-cell .icon{
    width:34px;height:34px;border-radius:9px;
    display:flex;align-items:center;justify-content:center;
    background:var(--accent-soft);
    color:var(--accent-strong);
    font-size:16px;flex:none;
  }
  .mat-cell .meta{display:flex;flex-direction:column;}
  .mat-cell .meta .n{font-weight:800;font-size:13.5px;color:var(--text);}
  .mat-cell .meta .s{font-size:11.5px;color:var(--text-muted);}
  .bar-cell{min-width:150px;}
  .bar-track{
    position:relative;
    height:8px;
    border-radius:999px;
    background:var(--surface-alt);
    overflow:hidden;
    margin-bottom:5px;
  }
  .bar-fill{height:100%;border-radius:999px;}
  .bar-fill.good{background:var(--good);}
  .bar-fill.warn{background:var(--warn);}
  .bar-fill.crit{background:var(--critical);}
  .bar-fill.gray{background:var(--gray-badge);}
  .bar-num{font-size:11.5px;color:var(--text-muted);font-variant-numeric:tabular-nums;}
  .chevron{color:var(--text-muted);font-size:14px;}
  table.compare tbody td:nth-child(2){text-align:center;font-variant-numeric:tabular-nums;}
  table.compare thead th:nth-child(3){text-align:left;}
  table.compare tbody td:last-child{text-align:center;}

  .status-pill{
    font-size:11px;
    font-weight:700;
    padding:4px 9px;
    border-radius:999px;
    white-space:nowrap;
    display:inline-block;
  }
  .status-pill.good{color:var(--good);background:var(--good-soft);}
  .status-pill.warn{color:var(--warn);background:var(--warn-soft);}
  .status-pill.crit{color:var(--critical);background:var(--critical-soft);}
  .status-pill.gray{color:var(--gray-badge);background:var(--gray-soft);}

  /* ---------- Detail panel ---------- */
  .panel{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:18px;
    box-shadow:var(--shadow);
    padding:24px 26px 26px;
  }
  .panel-head{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    gap:16px;
    flex-wrap:wrap;
    margin-bottom:18px;
    padding-bottom:16px;
    border-bottom:1px solid var(--border);
  }
  .panel-head h2{
    font-size:20px;
    margin:0 0 4px;
    font-weight:800;
    display:flex;
    align-items:center;
    gap:10px;
  }
  .panel-head .note{font-size:13px;color:var(--text-muted);max-width:640px;}
  .chip-row{display:flex;gap:8px;flex-wrap:wrap;}
  .chip{
    font-size:12px;
    font-weight:700;
    padding:5px 10px;
    border-radius:8px;
    background:var(--surface-alt);
    color:var(--text-muted);
    border:1px solid var(--border);
  }

  .item-table-wrap, .order-table-wrap{overflow-x:auto;border:1px solid var(--border);border-radius:12px;}
  table{border-collapse:collapse;width:100%;font-size:13px;min-width:640px;}
  thead th{
    background:var(--surface-alt);
    color:var(--text-muted);
    font-weight:700;
    font-size:11.5px;
    letter-spacing:0.02em;
    text-align:right;
    padding:10px 12px;
    border-bottom:1px solid var(--border);
    border-right:1px solid var(--border);
    white-space:nowrap;
    position:sticky;top:0;
  }
  thead th:first-child, thead th:nth-child(2){text-align:left;}
  thead th:last-child, tbody td:last-child{border-right:none;}
  /* vertical rules between every column — without these, a blank "-" cell sitting
     next to another blank "-" cell is easy to misread as one missing column
     instead of two separate ones, which reads as a "shifted" row at a glance. */
  tbody td{
    padding:9px 12px;
    border-bottom:1px solid var(--border);
    border-right:1px solid var(--border);
    text-align:right;
    font-variant-numeric:tabular-nums;
    white-space:nowrap;
  }
  /* explicit class, not :first-child/:nth-child — rowspan-merged rows render fewer
     <td>s, so positional selectors would land on the wrong cell in those rows */
  td.name-cell{text-align:left;font-variant-numeric:normal;white-space:nowrap;}
  td.merged-cell{background:var(--surface-alt);}
  tbody tr:last-child td{border-bottom:none;}
  tbody tr:hover td{background:var(--surface-alt);}
  tr.subtotal td{background:var(--gray-soft);font-weight:700;}
  tr.total td{background:var(--accent-soft);font-weight:800;color:var(--accent-strong);}
  td.muted{color:var(--text-muted);}
  td.pending{color:var(--warn);font-weight:700;}
  .pending-tag{display:inline-block;font-size:10.5px;font-weight:700;color:var(--warn);background:var(--warn-soft);border-radius:5px;padding:1px 5px;margin-left:5px;vertical-align:1px;}
  .cell-note{font-size:11.5px;color:var(--text-muted);font-weight:400;white-space:normal;}

  .block-title{
    font-size:14px;
    font-weight:800;
    margin:26px 0 10px;
    display:flex;
    align-items:center;
    gap:8px;
  }
  .block-title:first-of-type{margin-top:4px;}
  .block-title .num{
    width:20px;height:20px;border-radius:6px;
    background:var(--accent);color:var(--surface);
    font-size:11px;display:inline-flex;align-items:center;justify-content:center;
    font-weight:800;
  }

  footer{
    margin-top:30px;
    text-align:center;
    font-size:11.5px;
    color:var(--text-muted);
  }

  @media (max-width:900px){
    .kpi-row{grid-template-columns:repeat(2,1fr);}
  }
  @media (max-width:560px){
    .kpi-row{grid-template-columns:1fr;}
    .panel{padding:18px;}
  }
</style>
</head>

function fmt(n){
  if(n === null || n === undefined || n === "" || Number.isNaN(n)) return "-";
  if(typeof n === "string") return n;
  const rounded = Math.round(n*1000)/1000;
  if(Number.isInteger(rounded)) return rounded.toLocaleString("ko-KR");
  return rounded.toLocaleString("ko-KR", {maximumFractionDigits:3});
}
function fmtWon(n){
  if(n === null || n === undefined) return "-";
  return n.toLocaleString("ko-KR") + "원";
}
function daysUntil(dateStr){
  if(!dateStr || typeof dateStr !== "string" || !/^\d{4}-\d{2}-\d{2}$/.test(dateStr)) return null;
  const base = new Date(REPORT_DATE + "T00:00:00");
  const target = new Date(dateStr + "T00:00:00");
  return Math.round((target - base) / 86400000);
}
function fmtDate(dateStr){
  if(!dateStr) return "-";
  if(!/^\d{4}-\d{2}-\d{2}$/.test(dateStr)) return dateStr;
  const [y,m,d] = dateStr.split("-");
  return `${y}.${m}.${d}`;
}
function statusFromDays(d){
  if(d === null) return "gray";
  if(d < 30) return "crit";
  if(d < 90) return "warn";

}
function statusLabel(s){
  return {good:"안정", warn:"주의", crit:"긴급", gray:"상시"}[s];

function addDays(dateStr, days){
  const d = new Date(dateStr + "T00:00:00");
  d.setDate(d.getDate() + days);
  return d.toISOString().slice(0,10);
}

// pre-compute status
CATEGORIES.forEach(cat=>{
  cat.items.forEach(it=>{
    const d = daysUntil(it.totalClearDate);
    it._days = d;
    it._status = statusFromDays(d);
  });
  cat._totalCurrent = cat.items.reduce((s,i)=> s + (typeof i.curStock === "number" ? i.curStock : 0), 0);
  cat._totalIncoming = cat.items.reduce((s,i)=> s + (typeof i.incStock === "number" ? i.incStock : 0), 0);

  // category-level 소진예상일은 개별 품목 중 가장 이른 날짜가 아니라,
  // "전체 재고(현재고+입고예정재고) ÷ 전체 월평균사용량" 기준으로 산출한다.
  const aggStock = cat._totalCurrent + cat._totalIncoming;
  const aggMonthlyUse = cat.items.reduce((s,i)=> s + (typeof i.monthlyUse === "number" ? i.monthlyUse : 0), 0);
  cat._aggDays = aggMonthlyUse > 0 ? Math.round(aggStock / aggMonthlyUse * 30) : null;
  cat._clearDate = cat._aggDays !== null ? addDays(REPORT_DATE, cat._aggDays) : null;
  cat._status = statusFromDays(cat._aggDays);
});

function renderKpis(){
  const totalCurrent = CATEGORIES.reduce((s,c)=> s + c._totalCurrent, 0);

  // 원료 그룹(카테고리) 단위 상태와 동일한 기준(전체 재고 ÷ 전체 월평균사용량)으로 집계 —
  // 탭·종합비교표·상세화면 배지와 반드시 같은 숫자를 가리켜야 한다.
  const critCats = CATEGORIES.filter(c=>c._status==="crit");
  const skuCount = CATEGORIES.reduce((s,c)=> s + c.items.length, 0);

  const kpis = [
    {label:"원료 그룹 수", value: CATEGORIES.length + " 종", foot:"올리브오일 · 레몬즙 · 토마토 · 블러드오렌지"},
    {label:"세부 품목(SKU) 수", value: skuCount + " 개", foot:"공급처·산지별 세부 원료 기준"},
    {label:"현재 보유재고 합계", value: fmtT(totalCurrent) + "<small>T</small>", foot:"입고예정 " + fmtT(totalIncoming) + "T 별도"},
    {label:"소진 임박 원료(30일 미만)", value: critCats.length + " 종", foot: critCats.length>0 ? critCats.map(c=>c.name).join(", ") + " 확인 필요" : "임박 원료 없음", crit: critCats.length>0}
  ];
  return `
    <div class="kpi-row">
      ${kpis.map(k => `
        <div class="kpi">
          <div class="label">${k.label}</div>
          <div class="value">${k.value}</div>
          <div class="foot${k.crit? ' crit':''}">${k.foot}</div>
        </div>
      `).join("")}
    </div>
  `;
}

  document.querySelectorAll(".compare tbody tr").forEach(tr=>{
    tr.addEventListener("click", ()=> goTo(tr.dataset.key));
  });
}

function itemRow(it, priceSpan, useSpan, totalSpan, curDateSpan, incDateSpan){
  const status = it._status;
  const clearDateTxt = it.totalClearDate ? fmtDate(it.totalClearDate) : null;
  // 배포용: 단가(평균매입가/판매가)는 표시하지 않는다.
  const useCell = useSpan > 0
    ? `<td class="${useSpan>1?'merged-cell':''}" rowspan="${useSpan}">${it.monthlyUse!=null? fmtT(it.monthlyUse): "-"}</td>`
    : "";
  // 총재고·상태는 개별 품목이 아니라 같은 매입가/사용량 묶음 전체의 합계이므로,
  // 그 묶음에 걸쳐 병합해 "현재고+입고예정재고"가 이 행 하나만의 값이 아님을 분명히 한다.
  const totalCells = totalSpan > 0
    ? `<td class="${totalSpan>1?'merged-cell':''}" rowspan="${totalSpan}"><b>${fmtT(it.totalStock)}</b></td>
       <td class="${totalSpan>1?'merged-cell':''}" rowspan="${totalSpan}"><span class="status-pill ${status}">${statusLabel(status)}${clearDateTxt? ' · '+clearDateTxt:''}</span></td>`
    : "";
  // 현재고/입고예정재고 소진일도 총재고와 같은 이유로 묶음 단위로만 계산되므로, 그 묶음에 걸쳐 병합한다.
  const curDateCell = curDateSpan > 0
    ? `<td class="${curDateSpan>1?'merged-cell':''}" rowspan="${curDateSpan}">${fmtDate(it.curClearDate)}</td>`
    : "";
  const incDateCell = incDateSpan > 0
    ? `<td class="${incDateSpan>1?'merged-cell':''}" rowspan="${incDateSpan}">${fmtDate(it.incClearDate)}</td>`
    : "";
  return `
    <tr>
      <td class="name-cell">${it.name}${it.memo? `<div class="cell-note">${it.memo}</div>`:""}</td>
      <td style="text-align:center">톤</td>
      ${useCell}
      <td>${fmtT(it.curStock)}</td>
      ${curDateCell}
      <td>${fmtT(it.incStock)}</td>
      ${incDateCell}
      ${totalCells}
    </tr>
  `;
}

// column indices that hold stock quantities (발주수량,입고량,미입고잔여,사용완료,창고보관재고) — shown in tons.
// index 4(1드럼 패킹, kg/드럼) and 5(발주드럼, 드럼 수) are packing specs, not inventory, and stay as-is.
const TON_COLS = [6,7,8,12,13];
// ETD/ETA/창고입고예정일(입고예정월) — "완료"나 "-"가 아니면 아직 입고 전(예정)이라는 뜻이라 눈에 띄게 강조한다.
const PENDING_COLS = [9,10,11];
function isPendingValue(v){ return v !== "완료" && v !== "-" && v !== ""; }
// 발주차수/NO(0)와 품명(1)이 빈 문자열인 행은 엑셀에서 바로 위 품목의 후속 입고 건으로 병합돼 있던 행이다.
function orderRow(r, cls, span){
  // NOTE: must not use `span || 1` — span can legitimately be 0 (omit this cell,
  // it's covered by a previous row's rowspan), and `0 || 1` would silently become 1.
  span = (span === undefined || span === null) ? 1 : span;
  return `<tr class="${cls||''}">` + r.map((c,i)=>{
    if(i===0 || i===1){
      if(span===0) return "";
      const cellClass = "name-cell" + (span>1 ? " merged-cell" : "");
      const rs = span>1 ? ` rowspan="${span}"` : "";
      return `<td class="${cellClass}"${rs}>${c}</td>`;
    }
    if(PENDING_COLS.includes(i) && isPendingValue(c)){
      // 창고입고예정일(=최종 입고 시점) 열에만 "예정" 배지를 달아 강조하고, ETD/ETA는 색상만 맞춰 과도한 반복을 피한다.
      const tag = i===11 ? '<span class="pending-tag">예정</span>' : "";
      return `<td class="pending">${c}${tag}</td>`;
    }
    if(typeof c !== "number") return `<td>${c}</td>`;
    return `<td>${TON_COLS.includes(i) ? fmtT(c) : fmt(c)}</td>`;
  }).join("") + `</tr>`;
}

function renderContent(){
  if(activeKey === "overview"){
    renderOverview();
  } else {
    renderMaterial();
  }
}

// 엑셀 원본은 평균매입가/판매가, 월평균사용량 값을 여러 하위 품목 행에 걸쳐 병합해서 표시한다.
// null인 행은 "바로 위 대표 행과 같은 값을 공유"한다는 뜻이므로, rowspan으로 그 병합을 재현한다.
function computeSpans(items, field){
  const spans = new Array(items.length).fill(1);
  let i = 0;
  while(i < items.length){
    let j = i + 1;
    while(j < items.length && items[j][field] === null) j++;
    spans[i] = j - i;
    for(let k=i+1; k<j; k++) spans[k] = 0;
    i = j;
  }
  return spans;
}
// 발주·입고 상세 내역(plain array rows)에서 품명(및 발주차수/NO)이 빈 문자열인 행은
// 엑셀에서 바로 위 행과 병합된 같은 품목의 후속 입고 건이라는 뜻이다.
function computeArraySpans(rows, colIndex){
  const spans = new Array(rows.length).fill(1);
  let i = 0;
  while(i < rows.length){
    let j = i + 1;
    while(j < rows.length && rows[j][colIndex] === "") j++;
    spans[i] = j - i;
    for(let k=i+1; k<j; k++) spans[k] = 0;
    i = j;
  }
  return spans;
}

function renderMaterial(){
  const content = document.getElementById("content");
  const cat = CATEGORIES.find(c=>c.key===activeKey);

  const useSpans = computeSpans(cat.items, "monthlyUse");
  const totalSpans = computeSpans(cat.items, "totalStock");
  const curDateSpans = computeSpans(cat.items, "curClearDate");
  const incDateSpans = computeSpans(cat.items, "incClearDate");
  const itemRows = cat.items.map((it,i)=> itemRow(it, null, useSpans[i], totalSpans[i], curDateSpans[i], incDateSpans[i])).join("");
  const hasMergedTotal = totalSpans.some(s=>s>1) || curDateSpans.some(s=>s>1) || incDateSpans.some(s=>s>1);

  const itemsTable = `
    <div class="item-table-wrap">
      <table>
        <thead><tr>
          <th>품명</th><th>단위</th><th>월평균사용량(T)</th>
          <th>현재고(T)</th><th>현재고 소진일</th><th>입고예정재고(T)</th><th>입고예정 소진일</th><th>총재고(T)</th><th>상태</th>
        </tr></thead>
        <tbody>${itemRows}</tbody>
      </table>
    </div>
    ${hasMergedTotal ? '<div class="table-note">회색 배경으로 병합된 월평균사용량·총재고·상태 셀은 여러 품목을 한 묶음으로 관리하는 값으로, 묶음 전체에 공통 적용됩니다. 현재고·입고예정재고는 품목별 개별 값입니다. (배포용 자료로 단가는 표시하지 않습니다)</div>' : ''}
  `;

  // aggregate rows (소계/총계) supply 8 values that map to columns
  // 발주수량,입고량,미입고잔여,ETD,ETA,창고입고예정일,사용완료,창고보관재고 —
  // i.e. skip 5 leading columns (품명~발주드럼) and leave 3 trailing columns
  // (원료보관장소,소비기한,신고구분) empty.
  const LEAD_BLANKS = 5, TRAIL_BLANKS = 3;
  // vals = [발주수량,입고량,미입고잔여,ETD,ETA,창고입고예정일,사용완료,창고보관재고] — indices 0,1,2,6,7 are stock quantities (tons)
  const AGG_TON_IDX = [0,1,2,6,7];
  function aggregateRow(label, vals, cls){
    const cells = vals.map((v,i)=>`<td>${typeof v==="number" ? (AGG_TON_IDX.includes(i) ? fmtT(v) : fmt(v)) : v}</td>`).join("");
    return `<tr class="${cls}"><td class="name-cell">${label}</td>${"<td></td>".repeat(LEAD_BLANKS)}${cells}${"<td></td>".repeat(TRAIL_BLANKS)}</tr>`;
  }

  let subtotalHtml = "";
  cat.subtotalRows.forEach(r=>{
    if(Array.isArray(r)){
      subtotalHtml += orderRow(r);
    } else {
      subtotalHtml += aggregateRow(r.label, r.vals, "subtotal");
    }
  });
  const totalHtml = aggregateRow(cat.totalRow.label, cat.totalRow.vals, "total");

  const orderNameSpans = computeArraySpans(cat.orderRows, 1);
  const orderTable = `
    <div class="order-table-wrap">
      <table>
        <thead><tr>${cat.orderHeaders.map(h=>`<th>${h.replace(/\n/g,'<br>')}</th>`).join("")}</tr></thead>
        <tbody>
          ${cat.orderRows.map((r,i)=>orderRow(r, "", orderNameSpans[i])).join("")}
          ${subtotalHtml}
          ${totalHtml}
        </tbody>
      </table>
    </div>
  `;

  content.innerHTML = `
    <div class="panel">
      <div class="panel-head">
        <div>
          <h2>${cat.icon} ${cat.name} <span class="status-pill ${cat._status}">${statusLabel(cat._status)}</span></h2>
          <div class="note">${cat.note}</div>
        </div>
        <div class="chip-row">
          <span class="chip">${cat.storage}</span>
          <span class="chip">SKU ${cat.items.length}개</span>
          <span class="chip">보유재고 ${fmtT(cat._totalCurrent)} T</span>
          <span class="chip">전체 소진 예상일 ${fmtDate(cat._clearDate)}</span>
        </div>
      </div>

      <div class="block-title"><span class="num">1</span>품목별 재고 현황</div>
      ${itemsTable}

      <div class="block-title"><span class="num">2</span>발주·입고 상세 내역</div>
      <div class="table-note">재고 관련 수치(발주수량·입고량·미입고잔여·사용완료·창고보관재고)는 톤(T) 기준이며, 1드럼 패킹 중량은 kg 그대로 표기합니다. 주황색으로 강조된 ETD·ETA·창고입고예정일은 아직 입고 전(예정) 상태입니다.</div>
      ${orderTable}
    </div>
  `;
}

renderHeader();
renderTabbar();
renderContent();
</script>
</body>
</html>
